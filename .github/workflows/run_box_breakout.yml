name: Box Breakout Scan and Email

on:
  workflow_dispatch:
    inputs:
      target_dates:
        description: "扫描日期，例如 20260513 或 20260512,20260513；留空则默认北京时间今天"
        required: false
        default: ""
      start_date:
        description: "取数开始日期，默认 20240301"
        required: false
        default: "20240301"
  schedule:
    # UTC 时间。10:30 UTC = 北京时间 18:30。
    - cron: "30 10 * * 1-5"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run box breakout scan
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          TARGET_DATES: ${{ github.event.inputs.target_dates }}
          START_DATE: ${{ github.event.inputs.start_date || '20240301' }}
          MAX_WORKERS: "1"
          BATCH_START: "0"
          BATCH_SIZE: "10000"
          SLEEP_SEC: "0.03"
        run: python box_breakout_multi_dates.py

      - name: Upload output artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: box-breakout-output
          path: output/
          if-no-files-found: warn

      - name: Send QQ email
        if: always()
        env:
          QQ_MAIL_USER: ${{ secrets.QQ_MAIL_USER }}
          QQ_MAIL_AUTH_CODE: ${{ secrets.QQ_MAIL_AUTH_CODE }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_SUBJECT_PREFIX: "箱体突破扫描结果"
        run: python send_qq_email.py
